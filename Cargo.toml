[package]
name        =  "rsvm"
version     =  "0.0.1"
description =  "Rust Virtual Machine"
authors     = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
license     =  "MIT"
repository  =  "https://github.com/ponyatov/rsvm"
edition     =  "2024"

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[lib]
name        =  "vmlib"
path        =  "src/lib.rs"
crate-type  = ["cdylib"]

[dependencies]
const_format = "0.2"
nom          = "8.0"

[target.'cfg(all(target_os = "linux"))'.dependencies]
libc    = "0.2"
memmap2 = "0.9"
sdl2    = {version = "0.38", features = ["ttf","image"], optional = true}

[features]

# hw
pc              = ["i5"]
opi800          = ["rk3399"]
# cpu
i5              = ["x86_64","linux"]
i486            = ["i386"  ,"none" ]
i686            = ["i386"  ,"win32"]
rk3399          = ["aarch64"]
# arch
x86_64          = ["linux"]
i386            = ["linux"]
aarch64         = ["linux"]
# os
linux           = ["sdl"]
win32           = []
none            = []
# gui variant
sdl             = ["dep:sdl2"]
